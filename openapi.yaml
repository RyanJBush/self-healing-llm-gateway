openapi: 3.1.0
info:
  title: Self-Healing LLM Gateway
  version: 0.2.0
  description: |
    Local, non-streaming text-generation gateway with two ordered providers
    (`primary`, then `fallback`). One process, one worker, localhost only.
    **No authentication: do not expose publicly.**

    Retries, fallback, deadlines and circuit breaking are owned by the gateway.

    **No exactly-once guarantee.** `request_id` correlates trace events only. It is not
    an idempotency key and does not deduplicate. A timeout leaves the provider outcome
    uncertain: cancelling locally does not prove the remote work stopped, and a retry or
    fallback can duplicate work or billing.

    Budget (defaults): total deadline 2000 ms from handler entry (before body read and
    validation); per-call timeout min(500 ms, remaining); at most 3 provider calls
    (primary <= 2, fallback <= 1); 100 ms wait before a permitted primary retry (never
    sooner than a valid upstream `Retry-After`); nothing is dispatched at or after the
    deadline.
servers:
  - url: http://127.0.0.1:8000
    description: Loopback only. The launcher refuses non-loopback hosts.
paths:
  /v1/generations:
    post:
      operationId: createGeneration
      summary: Generate text through the standard route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationRequest'
            example:
              request_id: 123e4567-e89b-42d3-a456-426614174000
              input: Write a haiku about retries.
              route: standard
      responses:
        '200':
          description: Generated by the primary or, after failure, the fallback provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationSuccess'
        '422':
          description: >-
            Invalid JSON, content type, field, or route. Zero provider calls. The one
            validation envelope; no framework-default payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected gateway defect. No automatic retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: >-
            Non-retryable upstream outcome (any 4xx other than 408/429, or a malformed
            successful response). One call, no retry, no fallback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: >-
            Approved providers failed or were unavailable within policy. A failed
            fallback ends the request even if the global call cap has capacity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '504':
          description: Total request deadline exhausted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    GenerationRequest:
      type: object
      additionalProperties: false
      required: [request_id, input, route]
      properties:
        request_id:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: Canonical (lowercase, hyphenated) UUID. Correlation only.
        input:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: '\S'
          description: 1-4000 characters (code points); not whitespace-only; valid Unicode.
        route:
          type: string
          enum: [standard]
    GenerationSuccess:
      type: object
      additionalProperties: false
      required: [request_id, output, provider, model, execution_mode, attempts, fallback_used, elapsed_ms]
      properties:
        request_id:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        output:
          type: string
          minLength: 1
        provider:
          type: string
          description: Actual provider that served the request.
          enum: [primary, fallback]
        model:
          type: string
          description: Actual configured model ID.
        execution_mode:
          type: string
          enum: [stub, real]
        attempts:
          type: integer
          minimum: 1
          maximum: 3
          description: Provider calls started.
        fallback_used:
          type: boolean
          description: Whether a fallback call started.
        elapsed_ms:
          type: integer
          minimum: 0
          description: Monotonic elapsed time for the gateway operation.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, error, attempts, elapsed_ms]
      properties:
        request_id:
          type: [string, 'null']
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: Null when it cannot be safely validated.
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - upstream_rejected
                - providers_unavailable
                - deadline_exceeded
                - internal_error
            message:
              type: string
              description: Fixed, sanitized text. Never reflects client input or upstream content.
        attempts:
          type: integer
          minimum: 0
          maximum: 3
        elapsed_ms:
          type: integer
          minimum: 0
    OutOfContractError:
      type: object
      description: >-
        Unknown path (404) or method (405). Outside the contract table; same envelope
        shape with these extra codes. 405 carries `Allow: POST`.
      additionalProperties: false
      required: [request_id, error, attempts, elapsed_ms]
      properties:
        request_id: {type: 'null'}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, enum: [not_found, method_not_allowed]}
            message: {type: string}
        attempts: {type: integer, const: 0}
        elapsed_ms: {type: integer, minimum: 0}
