[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-llm-gateway"
version = "0.2.1"
requires-python = ">=3.11"
dependencies = ["uvicorn>=0.30"]

[project.optional-dependencies]
# Only gateway/http_provider.py needs httpx.
http = ["httpx>=0.27"]
# Everything the test suite imports: pytest; httpx (HTTP provider, live tests);
# pyyaml + jsonschema (tests/test_openapi.py validates responses against openapi.yaml).
test = ["pytest>=8", "httpx>=0.27", "pyyaml>=6", "jsonschema>=4"]

[tool.setuptools]
packages = ["gateway"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
