name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install with test dependencies
        run: python -m pip install -e ".[test]"
      - name: Tests (simulated-clock, real-HTTP, live-server)
        run: python -m pytest -q
      - name: Deterministic acceptance report (exits non-zero on any failed assertion)
        run: python -m gateway.acceptance --json acceptance-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-report-${{ matrix.os }}-py${{ matrix.python }}
          path: acceptance-report.json

  mutations:
    name: mutation check
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[test]"
      - name: Every mutant must make the suite fail
        run: python scripts/mutations.py --json mutation-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutation-report.json
